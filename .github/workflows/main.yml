name: CI

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "**"
  # Release candidates call these same jobs at their tested commit.
  workflow_call:
concurrency:
  # Separate standalone/called CI from its release caller to avoid cancellation.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # go needs absolute directories, using the $HOME variable doesn't work here.
  GOCACHE: /home/runner/work/go/pkg/build
  GOPATH: /home/runner/work/go
  GOBIN: /home/runner/work/go/bin
  GO111MODULE: on

  # If you change this please run `make lint` to see where else it needs to be
  # updated as well.
  GO_VERSION: 1.25.11

  BITCOIND_VERSION: '22.0'
  BITCOIND_IMAGE: 'lightninglabs/bitcoin-core'

  # Share the current miner pin with the btcd job's named version axis.
  BTCD_VERSION_LATEST: &btcd_latest v0.27.0

jobs:
  ########################
  # Format, compilation and generated-code checks
  ########################
  static-check:
    name: Static checks (format, compile)
    runs-on: ubuntu-latest
    steps:
      - name: git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Build tools image
        uses: ./.github/actions/tools-image

      - name: Check default values in sample-btcwallet.conf file
        run: make sample-conf-check

      - name: Check code format
        run: make -o docker-tools fmt-check

      - name: Check go modules tidiness
        run: make tidy-module-check

      - name: Check RPC format
        run: make rpc-check

      - name: Check generated SQL code is up-to-date
        run: make -o docker-tools sqlc-check

      - name: Check SQL formatting
        run: make sql-format-check

      - name: Check SQL linting
        run: make sql-lint-check

      - name: compile code
        run: go install -v ./...

      - name: Lint proto files
        run: make protolint

  ########################
  # Go lint
  ########################
  lint-check:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build tools image
        uses: ./.github/actions/tools-image

      - name: run lint
        run: make -o docker-tools lint-check

  check-commits:
    if: github.event_name == 'pull_request'
    name: Commit checks
    runs-on: ubuntu-latest
    steps:
      - name: git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: fetch and rebase on the PR base
        id: rebase
        uses: ./.github/actions/rebase

      - name: check commits
        env:
          BASE_REF: ${{ steps.rebase.outputs.base-ref }}
        run: scripts/check-each-commit.sh "upstream/${BASE_REF}"

  ########################
  # run unit tests
  ########################
  unit-test:
    name: Unit tests (${{ matrix.unit_type }})
    runs-on: ubuntu-latest
    strategy:
      # Allow other tests in the matrix to continue if one fails.
      fail-fast: false
      matrix:
        unit_type:
          - unit-race
          - unit-cover
    steps:
      - name: extract bitcoind from docker image
        run: |-
          IMAGE=${{ env.BITCOIND_IMAGE }}:${{ env.BITCOIND_VERSION }}
          docker pull $IMAGE

          BIN_PATH=$(docker run --rm --entrypoint sh $IMAGE -c '
            command -v bitcoind ||
            find /opt /usr -type f -name bitcoind 2>/dev/null | head -n 1
          ')
          if [ -z "$BIN_PATH" ]; then
            echo "could not locate bitcoind in $IMAGE" >&2
            exit 1
          fi

          CONTAINER_ID=$(docker create $IMAGE)
          sudo docker cp $CONTAINER_ID:$BIN_PATH /usr/local/bin/bitcoind
          docker rm $CONTAINER_ID
          bitcoind --version

      - name: git checkout
        uses: actions/checkout@v5

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: run ${{ matrix.unit_type }}
        run: make ${{ matrix.unit_type }}

      - name: Send coverage
        uses: coverallsapp/github-action@v2
        if: matrix.unit_type == 'unit-cover'
        continue-on-error: true
        with:
          file: coverage.txt
          flag-name: unit
          format: golang
          parallel: true

  ########################
  # run integration tests (SQLite + Postgres)
  ########################
  itest-db:
    name: Database itest (${{ matrix.db }}, ${{ matrix.race && 'race' || 'cover' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
        race: [false, true]
    steps:
      - name: git checkout
        uses: actions/checkout@v5

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: run ${{ matrix.db }} itest-db (coverage)
        if: ${{ !matrix.race }}
        run: make itest-db db=${{ matrix.db }} cover=1 verbose=1

      - name: run ${{ matrix.db }} itest-db-race
        if: matrix.race
        run: make itest-db-race db=${{ matrix.db }} verbose=1

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        if: ${{ !matrix.race }}
        continue-on-error: true
        with:
          file: coverage-itest-${{ matrix.db }}.txt
          flag-name: itest-db-${{ matrix.db }}
          format: golang
          parallel: true

  ########################
  # Run bwtest integration tests against each supported chain backend.
  #
  # Ordinary CI checks current daemon releases across the existing databases.
  # Historical release compatibility runs in the release-check workflow.
  ########################
  itest-btcd:
    name: Wallet itest (btcd ${{ matrix.btcd_version }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep the current release visible in job and failure-artifact names.
        btcd_version: [*btcd_latest]
        db: [kvdb, sqlite]
    steps:
      - name: git checkout
        uses: actions/checkout@v5

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'

      # The harness resolves both daemon executables through this PATH.
      - name: add go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Share authenticated installation and the exact backend/miner version guard.
      - name: install and check btcd ${{ matrix.btcd_version }}
        env:
          BTCD_VERSION: ${{ matrix.btcd_version }}
        run: scripts/install-btcd.sh "$BTCD_VERSION"

      # The btcd backend job runs btcd for both the shared miner and the chain
      # backend under test.
      - name: run itest (btcd, ${{ matrix.db }})
        run: make itest chain=btcd db=${{ matrix.db }}

      - name: upload itest logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          # Identify the exact daemon/database pair when a lane fails.
          name: itest-logs-btcd-${{ matrix.btcd_version }}-${{ matrix.db }}
          path: itest/test-logs
          retention-days: 5

  ########################
  # Run bwtest integration tests with the neutrino backend.
  #
  # Job flow:
  # - Install btcd `${{ env.BTCD_VERSION_LATEST }}`.
  # - Use btcd as the shared miner for the suite.
  # - Run `make itest chain=neutrino db=${{ matrix.db }}` so wallets use the
  #   in-process neutrino backend while blocks/peers come from btcd.
  ########################
  itest-neutrino:
    name: Wallet itest (neutrino, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [kvdb, sqlite]
    steps:
      - name: git checkout
        uses: actions/checkout@v5

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'

      # Expose the verified miner on the PATH used by the harness.
      - name: add go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Share authenticated installation and the exact backend/miner version guard.
      - name: install and check btcd ${{ env.BTCD_VERSION_LATEST }}
        env:
          BTCD_VERSION: ${{ env.BTCD_VERSION_LATEST }}
        run: scripts/install-btcd.sh "$BTCD_VERSION"

      # Neutrino runs in-process, but it still relies on the shared btcd miner
      # for chain data and peer connectivity.
      - name: run itest (neutrino, ${{ matrix.db }})
        run: make itest chain=neutrino db=${{ matrix.db }}

      - name: upload itest logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: itest-logs-neutrino-${{ matrix.db }}
          path: itest/test-logs
          retention-days: 5

  ########################
  # Run bwtest integration tests with the bitcoind backend.
  #
  # Job flow:
  # - Install btcd `${{ env.BTCD_VERSION_LATEST }}` as the shared miner.
  # - Test the pinned Core release on every existing wallet database.
  # - Verify its official archive before running the complete suite; older
  #   supported releases run in the release-check workflow.
  ########################
  itest-bitcoind:
    name: Wallet itest (bitcoind v${{ matrix.bitcoind.version }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pin the current Core artifact independently of mutable image tags.
        bitcoind:
          - version: '32.1'
            sha256: '61545c17c3120fb7412f896d248b11993af04ec8817aad3649c55b2afb044963'
        db: [kvdb, sqlite, postgres]
    steps:
      - name: git checkout
        uses: actions/checkout@v5

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'

      # Core and its btcd miner must resolve to the provisioned executables.
      - name: add go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Share authenticated installation and the exact backend/miner version guard.
      - name: install and check btcd ${{ env.BTCD_VERSION_LATEST }}
        env:
          BTCD_VERSION: ${{ env.BTCD_VERSION_LATEST }}
        run: scripts/install-btcd.sh "$BTCD_VERSION"

      # Verify the pinned archive and installed version before running Core.
      - name: install bitcoind ${{ matrix.bitcoind.version }}
        env:
          CORE_VERSION: ${{ matrix.bitcoind.version }}
          CORE_SHA256: ${{ matrix.bitcoind.sha256 }}
        run: scripts/install-bitcoind.sh "$CORE_VERSION" "$CORE_SHA256"

      - name: run itest (bitcoind, ${{ matrix.db }})
        run: make itest chain=bitcoind db=${{ matrix.db }}

      - name: upload itest logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          # Keep failure uploads distinct for each exact Core/database pair.
          name: itest-logs-bitcoind-${{ matrix.bitcoind.version }}-${{ matrix.db }}
          path: itest/test-logs
          retention-days: 5

  ########################
  # Complete parallel coverage uploads
  ########################
  finish:
    name: Coverage upload
    if: ${{ !cancelled() }}
    needs: [unit-test, itest-db]
    runs-on: ubuntu-latest
    steps:
      - name: Finish parallel Coveralls upload
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          parallel-finished: true
