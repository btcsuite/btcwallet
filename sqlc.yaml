# sqlc configuration file for generating type-safe Go code from SQL.
# For full documentation, see: https://docs.sqlc.dev/en/stable/reference/config.html
version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "wallet/internal/sql/pg/migrations"
      # Bootstrap DDL lets sqlc type-check identity queries; Store startup
      # applies it before numbered migrations.
      - "wallet/internal/sql/pg/bootstrap"
    queries: "wallet/internal/sql/pg/queries"
    gen:
      go:
        out: "wallet/internal/sql/pg/sqlc"
        package: "sqlc"

        # This is the driver package that sqlc will use in the generated code.
        sql_package: pgx/v5

        # Keep the established shared row/parameter types. pgx supports these
        # Scanner/Valuer types directly, so no handwritten value adapter is needed.
        overrides:
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullInt64"
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullInt32"
          - db_type: "pg_catalog.int2"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullInt16"
          - db_type: "text"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullString"
          - db_type: "pg_catalog.bool"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullBool"
          - db_type: "pg_catalog.timestamp"
            nullable: false
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullTime"

        # Generate a `Querier` interface of all query methods. It's useful for
        # mocking in tests.
        emit_interface: true

        # Export generated SQL statements so they're usable from other packages.
        emit_exported_queries: true

        # Generate prepared statements for better performance with database/sql.
        emit_prepared_queries: true

  - engine: "sqlite"
    schema:
      - "wallet/internal/sql/sqlite/migrations"
      # Bootstrap DDL lets sqlc type-check identity queries; Store startup
      # applies it before numbered migrations.
      - "wallet/internal/sql/sqlite/bootstrap"
    queries: "wallet/internal/sql/sqlite/queries"
    gen:
      go:
        out: "wallet/internal/sql/sqlite/sqlc"
        package: "sqlc"

        # This is the driver package that sqlc will use in the generated code.
        sql_package: database/sql

        # Generate a `Querier` interface of all query methods. It's useful for
        # mocking in tests.
        emit_interface: true

        # Export generated SQL statements so they're usable from other packages.
        emit_exported_queries: true

        # Generate prepared statements for better performance with database/sql.
        emit_prepared_queries: true
